<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bartolucci Digital – Hier entsteht unsere Website</title>
<meta name="description" content="Bartolucci Digital – Websites, Assistenten und Automatisierung. Unsere neue Website ist in Arbeit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2a3c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,#6fb6e6 0%,#9fd2f1 45%,#d8eef9 100%);
    color:#fff;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}

  .card{
    position:fixed;left:50%;top:max(3vh,14px);
    width:min(92vw,520px);
    padding:24px 30px 20px;
    border-radius:22px;
    background:rgba(28,38,56,.84);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(15,30,55,.35);
    text-align:center;
    animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both;
  }
  h1{font-size:clamp(1.8rem,5.5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .tag{margin-top:8px;font-size:clamp(.88rem,2.5vw,1.02rem);opacity:.9}
  .status{
    margin:18px auto 0;padding-top:16px;max-width:340px;
    border-top:1px solid rgba(255,255,255,.18);
    font-weight:600;font-size:1.02rem;letter-spacing:.01em;
  }
  .note{margin-top:8px;font-size:.9rem;opacity:.75}
  .copy{margin-top:12px;font-size:.75rem;color:rgba(255,255,255,.55)}
  .copy a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .copy a:hover{color:#fff}
  @keyframes rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

  /* Szene */
  .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{from{transform:translateX(-650px)}to{transform:translateX(1650px)}}
  .birds{animation:fly 34s linear infinite}
  @keyframes fly{0%{transform:translate(-400px,0)}50%{transform:translate(600px,-30px)}100%{transform:translate(1600px,0)}}
  .wing{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
  @keyframes flap{to{transform:scaleY(.25)}}
  .bob{animation:bob 3.5s ease-in-out infinite alternate}
  .bob-soft{animation:bobsoft 4s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(3px)}}
  @keyframes bobsoft{to{transform:translateY(1.2px)}}
  .sail{animation:sail 48s linear infinite}
  @keyframes sail{from{transform:translateX(-750px)}to{transform:translateX(1500px)}}
  .tug{animation:tug 36s linear -14s infinite}
  @keyframes tug{from{transform:translateX(1500px)}to{transform:translateX(-850px)}}
  .waves1{animation:sway 7s ease-in-out infinite alternate}
  .waves2{animation:sway 9s ease-in-out infinite alternate-reverse}
  @keyframes sway{from{transform:translateX(-25px)}to{transform:translateX(25px)}}

  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg id="scene" viewBox="-110 -170 1120 870" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a83b3"/><stop offset="1" stop-color="#22486c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0dc"/><stop offset=".45" stop-color="#a9cdec"/><stop offset=".75" stop-color="#6c9fcf"/><stop offset="1" stop-color="#4f84b8"/>
    </linearGradient>
    <linearGradient id="glassShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#1d4a78" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="brick" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#b4573a"/><rect y="2.4" width="6" height=".6" fill="#9a4630" opacity=".55"/>
    </pattern>
    <pattern id="ribs" width="4" height="13" patternUnits="userSpaceOnUse">
      <rect width="1" height="13" fill="rgba(0,0,0,.13)"/>
    </pattern>
    <clipPath id="elphiClip">
      <path d="M670 409 L670 284 C674 307 692 325 720 327 C739 326 751 321 754 316 C754 333 766 360 798 364 C812 365 827 348 834 337 C834 355 839 365 848 365 C862 365 873 358 880 350 L880 409 Z"/>
    </clipPath>
  </defs>

  <!-- Sonne & Wolken -->
  <circle cx="900" cy="40" r="75" fill="#fff6cf" opacity=".35"/>
  <circle cx="900" cy="40" r="40" fill="#fff3c2"/>
  <g id="clouds"></g>

  <!-- Köhlbrandbrücke -->
  <g id="bridge"></g>

  <!-- Vögel -->
  <g class="birds">
    <g transform="translate(0 70)"><path class="wing" d="M0 0 Q6 -7 12 0 Q18 -7 24 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
    <g transform="translate(34 84)"><path class="wing" style="animation-delay:-.2s" d="M0 0 Q5 -6 10 0 Q15 -6 20 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
    <g transform="translate(-28 92)"><path class="wing" style="animation-delay:-.35s" d="M0 0 Q5 -6 10 0 Q15 -6 20 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>

  <!-- Wasser -->
  <rect x="-2500" y="486" width="6000" height="900" fill="url(#water)"/>
  <g id="wavesA" class="waves1" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"></g>

  <!-- Elbphilharmonie mit Kai, Hafenkränen und Nachbarbau -->
  <g id="elphi">
    <!-- Nachbarbau rechts -->
    <rect x="944" y="424" width="80" height="46" fill="#e6e9ec"/>
    <g fill="#9fb3c3" id="nbWin"></g>
    <!-- Kaimauer -->
    <rect x="652" y="470" width="420" height="26" fill="#d9d3c3"/>
    <rect x="652" y="466" width="420" height="5" fill="#b9b2a2"/>
    <rect x="652" y="490" width="420" height="6" fill="#bfb7a5"/>
    <g fill="#c8c1af" id="quayJoints"></g>
    <!-- Backsteinsockel -->
    <rect x="670" y="415" width="210" height="52" fill="url(#brick)"/>
    <g fill="#000" opacity=".1"><rect x="670" y="415" width="53" height="52"/><rect x="777" y="415" width="32" height="52"/></g>
    <g fill="#3b3f46">
      <rect x="722" y="415" width="9" height="52"/><rect x="768" y="415" width="9" height="52"/>
      <rect x="809" y="415" width="8" height="52"/><rect x="858" y="415" width="5" height="52"/>
    </g>
    <g fill="#8fb2cc" id="recessWin"></g>
    <rect x="681" y="424" width="7" height="6" fill="#3b3f46"/>
    <rect x="745" y="459" width="12" height="8" fill="#3b3f46"/>
    <!-- Plaza -->
    <rect x="670" y="409" width="210" height="6" fill="#2c333c"/>
    <g fill="#cfd8df" opacity=".5" id="plazaCols"></g>
    <!-- Glasaufbau -->
    <path d="M670 409 L670 284 C674 307 692 325 720 327 C739 326 751 321 754 316 C754 333 766 360 798 364 C812 365 827 348 834 337 C834 355 839 365 848 365 C862 365 873 358 880 350 L880 409 Z" fill="url(#glass)"/>
    <g clip-path="url(#elphiClip)">
      <rect x="670" y="270" width="210" height="140" fill="url(#glassShade)"/>
      <g id="floors" stroke="#ffffff" stroke-opacity=".28" stroke-width=".7"></g>
      <g id="loggias"></g>
    </g>
    <path d="M670 409 L670 284 C674 307 692 325 720 327 C739 326 751 321 754 316 C754 333 766 360 798 364 C812 365 827 348 834 337 C834 355 839 365 848 365 C862 365 873 358 880 350 L880 409" fill="none" stroke="#eaf3fa" stroke-width="1.6" stroke-linejoin="miter"/>
    <!-- Bogen der Plaza -->
    <path d="M787 415 V410 Q807 395 827 410 V415 Z" fill="#f1efe9"/>
    <path d="M792 415 V411 Q807 401 822 411 V415 Z" fill="#3a434e"/>
    <!-- Historische Kaikräne -->
    <g id="kaicranes" stroke="#f4f6f8" stroke-linecap="round" fill="#f4f6f8"></g>
  </g>

  <!-- Kai -->
  <rect x="-900" y="470" width="1235" height="10" fill="#6b7680"/>
  <rect x="-900" y="480" width="1235" height="16" fill="#4c5660"/>
  <g id="yard"></g>

  <!-- Liegendes Schiff unter den Kränen -->
  <g id="ship">
    <g class="bob-soft">
      <path d="M338 450 H650 L632 500 H356 Z" fill="#22314b"/>
      <path d="M350 490 H636 L632 500 H356 Z" fill="#c8473d"/>
      <rect x="598" y="402" width="38" height="48" fill="#f4f6f8"/>
      <rect x="602" y="408" width="30" height="6" fill="#2c3e5a"/>
      <rect x="602" y="420" width="30" height="5" fill="#2c3e5a" opacity=".7"/>
      <rect x="609" y="388" width="12" height="14" fill="#d6453d"/>
      <g id="deck"></g>
    </g>
  </g>

  <g id="cranes"></g>
  <g id="trucks"></g>
  <g id="movers"></g>

  <g id="wavesB" class="waves2" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"></g>

  <!-- Fahrendes Containerschiff -->
  <g class="sail">
    <g class="bob">
      <ellipse cx="-30" cy="612" rx="55" ry="4" fill="#fff" opacity=".35"/>
      <path d="M0 572 H320 L298 614 H14 Z" fill="#1d2b44"/>
      <path d="M8 604 H303 L298 614 H14 Z" fill="#c8473d"/>
      <rect x="10" y="522" width="36" height="50" fill="#f4f6f8"/>
      <rect x="14" y="528" width="28" height="6" fill="#2c3e5a"/>
      <rect x="14" y="540" width="28" height="5" fill="#2c3e5a" opacity=".7"/>
      <rect x="22" y="506" width="13" height="16" fill="#d6453d"/>
      <g id="shipload"></g>
    </g>
  </g>

  <!-- Schlepper -->
  <g class="tug">
    <g class="bob">
      <ellipse cx="80" cy="668" rx="30" ry="3" fill="#fff" opacity=".35"/>
      <path d="M0 652 L10 668 H62 L64 652 Z" fill="#d6453d"/>
      <rect x="28" y="638" width="22" height="14" fill="#f4f6f8"/>
      <rect x="31" y="642" width="16" height="4" fill="#2c3e5a"/>
      <rect x="40" y="629" width="6" height="9" fill="#2b2f36"/>
    </g>
  </g>
</svg>

<main class="card">
  <h1>Bartolucci Digital</h1>
  <p class="tag">Websites · Assistenten · Automatisierung</p>
  <p class="status">Hier entsteht unsere neue Website</p>
  <p class="note">Unsere Kräne laden gerade die Container – schauen Sie bald wieder vorbei.</p>
  <p class="copy">© 2026 Bartolucci Digital · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></p>
</main>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  let seed = 11;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const COLORS = ['#e8b13a','#2e7fc1','#d6453d','#3a9a5b','#f08a24','#5fb0dd','#7a5cc0'];
  const pick = () => COLORS[Math.floor(rnd() * COLORS.length)];

  function makeBox(parent){
    const g = el('g', {}, parent);
    el('rect', {width:28, height:13, fill:pick(), stroke:'rgba(0,0,0,.2)', 'stroke-width':1}, g);
    el('rect', {x:1, y:1, width:26, height:11, fill:'url(#ribs)'}, g);
    return g;
  }
  const place = (g, x, y) => g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);

  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const easeIn = t => t*t*t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const lin = t => t;
  function tween(ms, fn, e = ease){
    return new Promise(res => {
      const t0 = performance.now();
      (function step(now){
        const t = Math.min(1, (now - t0) / ms);
        fn(e(t));
        t < 1 ? requestAnimationFrame(step) : res();
      })(t0);
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function channel(){
    const q = [], w = [];
    return {
      put(v){ w.length ? w.shift()(v) : q.push(v); },
      take(){ return q.length ? Promise.resolve(q.shift()) : new Promise(r => w.push(r)); }
    };
  }

  /* ---------- Wolken ---------- */
  const clouds = $('clouds');
  [[-90,70,1],[-40,90,.8],[10,60,1.1],[-120,110,.7],[60,80,.9]].forEach(([y,t,s],i) => {
    const g = el('g', {class:'cloud'}, clouds);
    g.style.animationDuration = t + 's';
    g.style.animationDelay = (-t * i / 5) + 's';
    const c = el('g', {transform:`translate(0 ${y}) scale(${s})`, fill:'#fff', opacity:.92}, g);
    el('ellipse', {cx:0, cy:0, rx:62, ry:17}, c);
    el('ellipse', {cx:-24, cy:-10, rx:30, ry:19}, c);
    el('ellipse', {cx:20, cy:-15, rx:34, ry:24}, c);
  });

  /* ---------- Köhlbrandbrücke ---------- */
  const br = $('bridge');
  const BR = '#a4b8b0';
  const deckY = x => { const t = (x + 700) / 2400; return 340 - 260 * t * (1 - t); };
  // Rampenpfeiler außerhalb des Schrägseilbereichs
  for (let x = -700; x <= 1700; x += 42){
    if (x > -120 && x < 1120) continue;
    el('rect', {x:x-2.5, y:deckY(x)+6, width:5, height:486-deckY(x)-6, fill:BR}, br);
  }
  // Schrägseile (Fächer)
  [130, 870].forEach(px => {
    for (let i = 0; i < 12; i++){
      const a = 24 + i * 22, top = 44 + i * 1.6;
      [-1, 1].forEach(dir => {
        const x = px + dir * a;
        el('line', {x1:px, y1:top, x2:x, y2:deckY(x).toFixed(1), stroke:BR, 'stroke-width':1.1}, br);
      });
    }
  });
  el('path', {d:'M-700 340 Q500 210 1700 340', fill:'none', stroke:BR, 'stroke-width':8}, br);
  el('path', {d:'M-700 347 Q500 217 1700 347', fill:'none', stroke:'#8fa39b', 'stroke-width':2}, br);
  [130, 870].forEach(px => {
    const dk = deckY(px);
    el('polygon', {points:`${px-12},486 ${px-7},${dk} ${px-3},38 ${px+3},38 ${px+7},${dk} ${px+12},486`, fill:BR}, br);
    el('rect', {x:px-13, y:dk+7, width:26, height:5, fill:'#8fa39b'}, br);
  });

  /* ---------- Elbphilharmonie-Details ---------- */
  const pc = $('plazaCols');
  for (let x = 674; x < 878; x += 6) el('rect', {x, y:410, width:1.2, height:5}, pc);
  const fl = $('floors');
  for (let y = 404; y > 270; y -= 6.5) el('line', {x1:670, y1:y.toFixed(1), x2:880, y2:y.toFixed(1)}, fl);
  for (let x = 674; x < 880; x += 7) el('line', {x1:x, y1:270, x2:x, y2:409, 'stroke-opacity':.18}, fl);
  let s2 = 7; const r2 = () => (s2 = (s2 * 9301 + 49297) % 233280) / 233280;
  // Fenster: weiße Schalen mit dunklem Schlitz, sauber in Spalten, links dichter
  const lg = $('loggias');
  let col = 0;
  for (let x = 675; x < 874; x += 10.5, col++){
    const dens = .82 - (x - 670) / 210 * .5;
    for (let y = 288 + (col % 2) * 5; y < 402; y += 10){
      if (r2() > dens) continue;
      el('rect', {x:x.toFixed(1), y:(y - 1.6).toFixed(1), width:6, height:1.6, fill:'#35577a', opacity:.85}, lg);
      el('path', {d:`M${x.toFixed(1)} ${y} a3 2.8 0 0 0 6 0 z`, fill:'#f5f9fc'}, lg);
    }
  }
  // Fenster in den dunklen Fugen
  const rw = $('recessWin');
  [[722,9],[768,9],[809,8]].forEach(([x,w]) => { for (let y = 419; y < 465; y += 6) el('rect', {x:x+2, y, width:w-4, height:3, opacity:.6}, rw); });
  // Kaimauer-Fugen
  const qj = $('quayJoints');
  for (let x = 660; x < 1072; x += 24) el('rect', {x, y:471, width:1, height:19}, qj);
  // Nachbarbau-Fenster
  const nb = $('nbWin');
  for (let y = 428; y < 466; y += 7) el('rect', {x:948, y, width:72, height:3}, nb);
  // Weiße historische Kaikräne
  const kc = $('kaicranes');
  [[892,0],[910,4],[928,-3]].forEach(([x,o]) => {
    el('rect', {x:x-5, y:448, width:10, height:18, stroke:'none'}, kc);
    el('path', {d:`M${x-6} 466 L${x-3} 448 M${x+6} 466 L${x+3} 448`, fill:'none', 'stroke-width':1.6}, kc);
    el('rect', {x:x-4, y:438+o, width:8, height:10, stroke:'none'}, kc);
    el('path', {d:`M${x} ${440+o} L${x+16} ${398+o}`, fill:'none', 'stroke-width':2.2}, kc);
    el('path', {d:`M${x+16} ${398+o} L${x+16} ${416+o}`, fill:'none', 'stroke':'#4a4f57', 'stroke-width':.6}, kc);
  });

  /* ---------- Wellen ---------- */
  const wa = $('wavesA'), wb = $('wavesB');
  for (let i = 0; i < 70; i++){
    const x = -500 + rnd() * 2000, y = 506 + rnd() * 185, l = 12 + rnd() * 22;
    el('path', {d:`M${x.toFixed(1)} ${y.toFixed(1)} q${(l/4).toFixed(1)} -3 ${(l/2).toFixed(1)} 0 t${(l/2).toFixed(1)} 0`}, i % 2 ? wa : wb);
  }

  /* ---------- Fahrendes Schiff: Ladung ---------- */
  const sl = $('shipload');
  for (let c = 0; c < 9; c++){
    const rows = Math.min(3, 2 + ((c * 5) % 3 === 0 ? 1 : 0) + (c % 4 === 1 ? 1 : 0));
    for (let r = 0; r < rows; r++) place(makeBox(sl), 55 + c * 27.5, 559 - r * 14);
  }

  /* ---------- Hafenlogik ---------- */
  const yardG = $('yard'), deck = $('deck'), movers = $('movers'), shipG = $('ship');
  const YARD_H = [5,5,5,4,4,4];                 // 27 Container auf dem Kai
  const HANDFUL = [[0,0],[2,0],[3,0],[3,1],[6,0]]; // 5 Container schon an Bord
  const SHIP_ROWS = 4, SHIP_COLS = 8;
  const colX = c => 345 + 29 * c;
  const rowTop = r => 436 - 14 * r;
  let yard = [], shipH = [];

  function fillYard(animated){
    yardG.innerHTML = '';
    yard = YARD_H.map((h, c) => ({x: -92 + c * 29, boxes: [], busy: false}));
    let i = 0;
    yard.forEach((col, ci) => {
      for (let r = 0; r < YARD_H[ci]; r++){
        const b = makeBox(yardG), top = 456 - 14 * r;
        col.boxes.push(b);
        if (animated){
          b.setAttribute('opacity', 0);
          place(b, col.x, top - 120);
          const delay = (i++) * 110;
          setTimeout(() => tween(550, t => { place(b, col.x, top - 120 * (1 - t)); b.setAttribute('opacity', Math.min(1, t * 2)); }, easeOut), delay);
        } else place(b, col.x, top);
      }
    });
  }
  function resetShip(){
    deck.innerHTML = '';
    shipH = new Array(SHIP_COLS).fill(0);
    HANDFUL.forEach(([c, r]) => { place(makeBox(deck), colX(c), rowTop(r)); shipH[c] = Math.max(shipH[c], r + 1); });
  }

  /* Kräne */
  const blue = '#1f55a8';
  const cranes = [{x0:107,B:200,cols:[0,1]},{x0:194,B:182,cols:[2,3,4]},{x0:281,B:194,cols:[5,6,7]}];
  cranes.forEach(c => {
    const {x0:x, B} = c;
    const g = el('g', {}, $('cranes'));
    el('path', {d:`M${x+23} ${B-50} L${x+290} ${B+2} M${x+23} ${B-50} L${x-25} ${B+2}`, stroke:blue, 'stroke-width':2, fill:'none'}, g);
    el('path', {d:`M${x+3} ${B+22} L${x+23} ${B-50} L${x+44} ${B+22}`, stroke:blue, 'stroke-width':5, fill:'none', 'stroke-linejoin':'round'}, g);
    el('rect', {x, y:B+30, width:7, height:470-B-30, fill:blue}, g);
    el('rect', {x:x+40, y:B+30, width:7, height:470-B-30, fill:blue}, g);
    el('rect', {x:x-5, y:B+22, width:57, height:10, fill:blue}, g);
    el('rect', {x:x-25, y:B, width:315, height:9, fill:blue}, g);
    el('rect', {x:x-22, y:B-16, width:42, height:16, fill:'#f4f6f8'}, g);
    el('rect', {x:x-22, y:B-7, width:42, height:4, fill:'#d6453d'}, g);
    c.trolley = el('g', {}, g);
    c.cable = el('rect', {x:x+21, y:B+15, width:2, height:22, fill:'#2b2f36'}, c.trolley);
    el('rect', {x:x+14, y:B+8, width:16, height:8, rx:1.5, fill:'#d6453d'}, c.trolley);
    c.hook = el('g', {}, c.trolley);
    el('rect', {x:x+6, y:B+36, width:32, height:4, fill:'#2b2f36'}, c.hook);
    c.tx = 0; c.dy = 0; c.box = null; c.busy = false; c.reserved = false; c.inflight = 0;
    c.jobs = channel();
    c.update = () => {
      c.trolley.setAttribute('transform', `translate(${c.tx.toFixed(1)} 0)`);
      c.cable.setAttribute('height', (22 + c.dy).toFixed(1));
      c.hook.setAttribute('transform', `translate(0 ${c.dy.toFixed(1)})`);
      if (c.box) place(c.box, x + 8 + c.tx, B + 40 + c.dy);
    };
    c.free = () => c.cols.reduce((s, k) => s + SHIP_ROWS - shipH[k], 0) - c.inflight;
  });

  async function runCrane(c){
    const top0 = c.B + 40;
    while (true){
      const job = await c.jobs.take();
      c.busy = true;
      const dp = job.bedTop - top0;
      await tween(1900, t => { c.dy = dp * t; c.update(); });
      c.box = job.box; c.reserved = false; job.release();
      await wait(350);
      await tween(1800, t => { c.dy = dp * (1 - t); c.update(); });
      let col = c.cols[0];
      for (const k of c.cols) if (shipH[k] < shipH[col]) col = k;
      const r = shipH[col]++; c.inflight--;
      const T = colX(col) - (c.x0 + 8), dd = rowTop(r) - top0;
      await tween(900 + T * 7, t => { c.tx = T * t; c.update(); });
      await tween(1700, t => { c.dy = dd * t; c.update(); });
      const b = c.box; c.box = null;
      deck.appendChild(b); place(b, colX(col), rowTop(r));
      await wait(350);
      await tween(1600, t => { c.dy = dd * (1 - t); c.update(); });
      await tween(900 + T * 7, t => { c.tx = T * (1 - t); c.update(); });
      c.busy = false;
    }
  }

  /* LKW */
  const trucks = [{lane:0, color:'#f0b13a', home:75}, {lane:9, color:'#e9eef2', home:30}];
  trucks.forEach(tk => {
    const y = tk.lane;
    tk.g = el('g', {}, $('trucks'));
    el('rect', {x:0, y:458+y, width:46, height:5, fill:'#3a3f47'}, tk.g);
    el('rect', {x:34, y:446+y, width:12, height:13, rx:2, fill:tk.color}, tk.g);
    el('rect', {x:37, y:448+y, width:7, height:5, rx:1, fill:'#cfe6f4'}, tk.g);
    [8, 22, 39].forEach(cx => el('circle', {cx, cy:466+y, r:4, fill:'#1d2027'}, tk.g));
    tk.x = tk.home; tk.box = null; tk.bedTop = 445 + y;
    tk.update = () => {
      tk.g.setAttribute('transform', `translate(${tk.x.toFixed(1)} 0)`);
      if (tk.box) place(tk.box, tk.x + 3, tk.bedTop);
    };
    tk.update();
  });
  function driveTo(tk, x){
    const x0 = tk.x, d = Math.abs(x - x0);
    if (d < 1) return Promise.resolve();
    return tween(500 + d * 9, t => { tk.x = x0 + (x - x0) * t; tk.update(); });
  }
  function pickYardCol(){
    for (let i = yard.length - 1; i >= 0; i--) if (yard[i].boxes.length && !yard[i].busy) return yard[i];
    return null;
  }
  function chooseCrane(tk){
    let best = null;
    for (const c of cranes){
      if (c.reserved || c.free() <= 0) continue;
      if (!best || Math.abs(c.x0 - tk.x) < Math.abs(best.x0 - tk.x)) best = c;
    }
    return best;
  }

  let state = 'loading';
  async function runTruck(tk){
    while (true){
      const col = state === 'loading' ? pickYardCol() : null;
      if (!col){ await driveTo(tk, tk.home); await wait(700); continue; }
      col.busy = true;
      const box = col.boxes.pop();
      const fromX = col.x, fromY = 456 - 14 * col.boxes.length;
      await driveTo(tk, col.x - 3);
      movers.appendChild(box);
      const toY = tk.bedTop, peak = Math.min(fromY, toY) - 22;
      await tween(1300, t => {
        const y = t < .5 ? fromY + (peak - fromY) * ease(t * 2) : peak + (toY - peak) * ease((t - .5) * 2);
        place(box, fromX + (tk.x + 3 - fromX) * t, y);
      }, lin);
      tk.box = box; col.busy = false;
      let c;
      while (!(c = chooseCrane(tk))) await wait(400);
      c.reserved = true; c.inflight++;
      await driveTo(tk, c.x0 + 5);
      await new Promise(res => c.jobs.put({box, bedTop: tk.bedTop, release: () => { tk.box = null; res(); }}));
      await wait(250);
    }
  }

  async function runCycle(){
    while (true){
      state = 'loading';
      while (shipH.reduce((a, b) => a + b, 0) < SHIP_ROWS * SHIP_COLS || cranes.some(c => c.busy)) await wait(600);
      state = 'away';
      await wait(4000);
      await tween(15000, t => shipG.setAttribute('transform', `translate(${(1150 * t).toFixed(1)} 0)`), easeIn);
      resetShip();
      fillYard(true);
      await tween(14000, t => shipG.setAttribute('transform', `translate(${(1150 * (1 - t)).toFixed(1)} 0)`), easeOut);
      await wait(800);
    }
  }

  fillYard(false);
  resetShip();
  cranes.forEach(c => c.update());

  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(() => {
      cranes.forEach(runCrane);
      trucks.forEach((tk, i) => setTimeout(() => runTruck(tk), i * 1800));
      runCycle();
    }, 1200);
  }

  /* Ausschnitt an Hoch-/Querformat anpassen */
  const svg = $('scene');
  function fit(){
    svg.setAttribute('viewBox', innerWidth < innerHeight * 0.9 ? '-100 30 1005 670' : '-110 -170 1120 870');
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
