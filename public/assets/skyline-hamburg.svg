<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" fill="currentColor">
  <!-- Hamburg skyline, own vector drawing for Bartolucci Digital (no source image, no tracing).
       Left to right: three container gantry cranes, Köhlbrandbrücke, Elbphilharmonie, St. Michaelis,
       Heinrich-Hertz-Turm, Speicherstadt gables. Layers are separate groups for parallax:
       #sky-cranes, #sky-city; the container ship is a symbol (#sky-ship) so it can move on its own. -->
  <defs>
    <symbol id="sky-ship" viewBox="0 0 360 90" fill="currentColor">
      <path d="M2 58h344l-12 26H30Q12 74 2 58z"/>
      <path d="M40 34h28v23H40zM70 34h28v23H70zM100 26h28v31h-28zM130 34h28v23h-28zM160 26h28v31h-28zM190 34h28v23h-28zM220 30h28v27h-28zM250 38h24v19h-24z"/>
      <path d="M282 22h34v35h-34zM286 14h26v8h-26zM296 4h8v10h-8z"/>
      <path d="M14 50h20v8H14z"/>
    </symbol>
    <!-- gantry crane: two legs, portal beam, A-frame, boom over the water, stays, machinery house -->
    <g id="sky-crane" fill="currentColor">
      <path d="M0 150h8v126H0zM64 150h8v126h-8zM-4 144h80v10H-4zM3 110h6v34H3zM63 110h6v34h-6z"/>
      <path d="M-110 102h232v9H-110zM70 88h46v15H70zM-62 111h20v11h-20zM-56 122h2v34h-2zM-48 122h2v34h-2zM-58 156h14v6h-14z"/>
      <path d="M24 102l11-52h8l11 52h-6l-9-44-9 44z"/>
      <path d="M37 50l2 3-146 52-2-3zM41 50l-2 3 80 51 2-3z"/>
      <path d="M5 156l62 50-3 4-62-50zM67 156L5 206l3 4 62-50z"/>
    </g>
    <g id="sky-cranes" fill="currentColor">
      <use href="#sky-crane" x="120"/>
      <use href="#sky-crane" x="236"/>
      <use href="#sky-crane" x="352"/>
    </g>
    <g id="sky-city" fill="currentColor">
      <!-- quay / ground line -->
      <path d="M0 276h1600v24H0z"/>
      <!-- Köhlbrandbrücke: rising deck, two pylons, cable fans -->
      <path d="M478 276l6-10Q620 214 760 266l6 10h-6Q620 222 484 276z"/>
      <path d="M566 248l3-158h6l3 158zM690 244l3-154h6l3 154z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M572 96L512 252M572 104L528 246M572 112L544 241M572 120L556 236M572 96L632 226M572 104L616 229M572 112L602 232M572 120L590 235"/>
        <path d="M696 96L636 226M696 104L652 224M696 112L666 223M696 120L678 223M696 96L752 260M696 104L738 254M696 112L724 248M696 120L712 243"/>
      </g>
      <!-- Elbphilharmonie: brick base (Kaispeicher) + glass body with the wave roof -->
      <path d="M800 276V208h194v68z"/>
      <path d="M806 208v-46q4-22 14-50 14 26 36 30 6-12 14-26 16 22 38 24 6-10 12-20 14 18 34 20 4-8 10-16 12 14 26 18v66z"/>
      <!-- St. Michaelis: nave with roof, tower stages, colonnade, copper dome, lantern, spire -->
      <path d="M1012 276v-52l54-22 54 22v52z"/>
      <path d="M1046 276V160h40v116zM1050 160v-32h32v32zM1053 128v-20h26v20zM1056 108V94h20v14z"/>
      <path d="M1052 94q2-22 14-28 12 6 14 28z"/>
      <path d="M1061 66V54h10v12zM1063 54q0-8 3-10 3 2 3 10zM1065 44V22h2v22z"/>
      <!-- Heinrich-Hertz-Turm: tapered shaft, two pods, mast, antenna -->
      <path d="M1154 276l8-176h12l8 176z"/>
      <path d="M1146 104q0-10 24-12 24 2 24 12zM1146 104h48v4h-48zM1152 82h36v8h-36zM1158 76h24v6h-24z"/>
      <path d="M1166 76V40h8v36zM1169 40V12h2v28z"/>
      <!-- Speicherstadt: warehouse blocks with stepped and pointed gables, small turrets -->
      <path d="M1222 276v-74h12v-10h10v-10h22v10h10v10h12v74z"/>
      <path d="M1296 276v-80l34-28 34 28v80z"/>
      <path d="M1370 276v-84h76v84zM1396 192v-22l11-14 11 14v22z"/>
      <path d="M1452 276v-70h10v-12h10v-12h10v-10h12v10h10v12h10v12h10v70z"/>
      <path d="M1532 276v-78l30-24 30 24v78zM1592 276v-60h8v60z"/>
    </g>
  </defs>
  <use href="#sky-cranes"/>
  <use href="#sky-city"/>
</svg>
