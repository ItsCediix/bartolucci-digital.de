  <article data-chapter="hook" class="copy">
    <h1 class="h-display">Websites für kleine Betriebe in Hamburg.</h1>
    <p class="lead">Wir sind zwei Gründer aus Hamburg. Wir bauen dir eine eigene Website, die nach deinem Laden aussieht, und kümmern uns danach darum. <span class="on-desktop">Rechts</span><span class="on-mobile">Oben</span> siehst du, wie das aussieht. Scroll einfach weiter.</p>
    <div class="cta-row">
      <a class="btn btn-primary btn-lg" href="#kontakt">Kontakt</a>
      <a class="btn btn-ghost btn-lg" href="#k-website" data-scroll>Zeig mal</a>
    </div>
  </article>

  <article data-chapter="website" class="copy">
    <h2 class="h-chapter" data-beat="1">Deine Website. Von Hand gebaut.</h2>
    <div class="body">
      <p data-beat="1">Am Laptop und am Handy, aus einem Guss.</p>
      <p data-beat="2">Preise und Öffnungszeiten stehen dort, wo deine Kunden nachsehen. Ändert sich etwas, reicht eine Nachricht an uns.</p>
      <p data-beat="3">Anfragen landen direkt bei dir im Postfach. Wer das Formular abschickt, bekommt sofort eine Bestätigung.</p>
    </div>
    <ul class="facts" data-beat="3">
      <li><strong>Eigene Gestaltung,</strong> kein Baukasten</li>
      <li><strong>Schnell,</strong> ohne Cookies, ohne Tracking</li>
      <li><strong>Live in etwa zehn Tagen,</strong> nach Erhalt deiner Inhalte</li>
    </ul>
    <p class="demo-note" data-beat="3"><span class="on-desktop">Rechts</span><span class="on-mobile">Oben</span>: Rad am Spritzenplatz – ein Demo-Projekt. Die Werkstatt ist erfunden, die Website haben wir gebaut.</p>
    <p class="more-link" data-beat="3"><a href="#preise">Preise weiter unten</a></p>
  </article>

  <article data-chapter="betreuung" class="copy">
    <h2 class="h-chapter" data-beat="1">Danach kümmern wir uns.</h2>
    <div class="body">
      <p data-beat="1">Für 49&nbsp;€ im Monat sind Hosting und Domain (Domainkosten bis 20&nbsp;€), regelmäßige Updates und kleine Änderungen abgedeckt.</p>
    </div>
    <ul class="facts">
      <li data-beat="1"><strong>Kleine Änderungen,</strong> eine Nachricht reicht – Öffnungszeiten, Adresse, Preise: ohne Rechnung.</li>
      <li data-beat="2"><strong>Hosting, Domain und Updates,</strong> läuft im Hintergrund – du merkst nichts davon.</li>
      <li data-beat="3"><strong>Größere Änderungen,</strong> als Korrekturrunde für 79&nbsp;€.</li>
    </ul>
  </article>
</template>
