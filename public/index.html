<template id="tpl-chapters">
  <article data-chapter="hook" class="copy">
    <p class="eyebrow">Bartolucci Digital · Hamburg</p>
    <h1 class="h-display">Websites, Assistenten und Technik, die im Hintergrund läuft.</h1>
    <p class="lead">Wir sind zwei Gründer aus Hamburg. Wir bauen dir eine Website von Hand, einen Assistenten, der dir morgens den Tag zusammenfasst, und die Technik dahinter. Rechts im Handy siehst du, wie das aussieht. Scroll einfach weiter.</p>
    <div class="cta-row">
      <a class="btn btn-primary btn-lg" href="#kontakt">Kontakt</a>
      <a class="btn btn-ghost btn-lg" href="#k-website" data-scroll>Zeig mal</a>
    </div>
  </article>

  <article data-chapter="website" class="copy">
    <p class="eyebrow" data-beat="1">01 · Websites</p>
    <h2 class="h-chapter" data-beat="1">Deine Website. Von Hand gebaut.</h2>
    <div class="body">
      <p data-beat="1">Am Laptop und am Handy, aus einem Guss.</p>
      <p data-beat="2">Preise und Öffnungszeiten stehen dort, wo deine Kunden nachsehen, und sie stimmen, weil du sie selbst ändern kannst.</p>
      <p data-beat="3">Anfragen landen direkt bei dir im Postfach. Wer das Formular abschickt, bekommt sofort eine Bestätigung.</p>
    </div>
    <ul class="facts" data-beat="3">
      <li>Eigene Gestaltung, kein Baukasten</li>
      <li>Schnell, ohne Cookies, ohne Tracking</li>
      <li>Live in etwa zehn Tagen nach Erhalt deiner Inhalte</li>
    </ul>
    <p class="demo-note" data-beat="1">Im Handy: <strong>Rad am Spritzenplatz</strong>, ein Demo-Projekt. Die Werkstatt ist erfunden, die Website haben wir gebaut.</p>
    <div class="offer" data-offer="full" data-beat="3"></div>
  </article>

  <article data-chapter="assistent" class="copy">
    <p class="eyebrow" data-beat="1">02 · Assistent</p>
    <h2 class="h-chapter" data-beat="1">Dein Assistent meldet sich.</h2>
    <div class="body">
      <p data-beat="1">Jeden Morgen zu der Zeit, die du festlegst: Wetter, Termine und die Mails, die warten.</p>
      <p data-beat="2">Auf Wunsch als kurze Sprachnotiz, damit du beim Aufschließen schon Bescheid weißt.</p>
      <p data-beat="3">Uhrzeit, Inhalte und Sprache stellst du selbst ein. Jedes Briefing nach deinen Wünschen.</p>
    </div>
    <ul class="facts" data-beat="3">
      <li>Wetter, Termine, Mails, auf Wunsch Verkehr</li>
      <li>Läuft in dem Messenger, den du schon nutzt</li>
      <li>Preis auf Anfrage – jedes Setup ist anders.</li>
    </ul>
  </article>

  <article data-chapter="automatisierung" class="copy">
    <p class="eyebrow" data-beat="1">03 · Automatisierung</p>
    <h2 class="h-chapter" data-beat="1">Im Hintergrund läuft viel Technik.</h2>
    <div class="body">
      <p data-beat="2">Hinter jedem Kästchen stecken sechs Schritte: Mail empfangen, Absender prüfen, Inhalt lesen, wichtig oder nicht, zusammenfassen, ablegen.</p>
      <p data-beat="3">Du siehst davon nur einen Schalter, der alle Postfächer bündelt. Wir bauen das Komplexe. Du bekommst das Einfache.</p>
    </div>
    <p class="key" data-beat="3">Läuft bei dir, <span class="mark">nicht bei uns.</span></p>
    <div class="body">
      <p data-beat="3">Die Automatik läuft auf deinen Konten und deinen Geräten. Wir richten sie ein und erklären sie dir. Deine Daten bleiben bei dir.</p>
    </div>
    <ul class="facts" data-beat="3">
      <li>Postfächer bündeln, Anfragen sortieren, Rechnungen erkennen</li>
      <li>Ein Schalter, kein Dashboard</li>
      <li>Preis auf Anfrage – jedes Setup ist anders.</li>
    </ul>
  </article>

  <article data-chapter="postfach" class="copy">
    <p class="eyebrow" data-beat="1">04 · Zusammenfassung</p>
    <h2 class="h-chapter" data-beat="1">Du bekommst eine klare Zusammenfassung.</h2>
    <div class="body">
      <p data-beat="1">Direkt in dein Postfach, in der Mail-App, die du schon hast.</p>
      <p data-beat="2">Jede Zusammenfassung ist persönlich aufgebaut: für die Werkstatt anders als für den Markt, für dich anders als für deine Kollegin.</p>
      <p data-beat="3">Keine neue App, kein neues Passwort, nichts zu installieren.</p>
    </div>
    <ul class="facts" data-beat="3">
      <li>Vier Abschnitte: Wetter, Termine, Mails, offene Punkte</li>
      <li>Ein Klick auf „Erledigt“, fertig für heute</li>
      <li>Keine neue App</li>
    </ul>
  </article>

  <article data-chapter="hamburg" class="copy">
    <p class="eyebrow" data-beat="1">05 · Über uns</p>
    <h2 class="h-chapter" data-beat="1">Zwei Gründer aus Hamburg.</h2>
    <div class="body">
      <p data-beat="1">Luca-Kay Bartolucci kommt aus dem Einzelhandel und kennt Ladenfläche, Lager und Frühschicht. Cederic Langpaap baut die Technik. Wir wissen, wie wenig Zeit ein Laden am Tag für seine Website hat. Deshalb bauen wir sie so, dass sie ohne dich läuft.</p>
      <p data-beat="3">Zum Schluss tippt sich die Adresse ins Handy. Sie führt hierher, auf diese Seite.</p>
    </div>
    <ul class="facts" data-beat="2">
      <li>Zwei Korrekturrunden sind immer drin</li>
      <li>Wir antworten meistens am selben Tag</li>
      <li>Treffen bei dir im Laden oder am Telefon</li>
    </ul>
    <div class="cta-row" data-beat="3">
      <a class="btn btn-primary btn-lg" href="#kontakt">Schreib uns</a>
    </div>
  </article>
</template>
