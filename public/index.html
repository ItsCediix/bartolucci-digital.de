<template id="tpl-chapters">
  <article data-chapter="hook" class="copy">
    <p class="eyebrow">Bartolucci Digital · Hamburg</p>
    <h1 class="h-display">Websites, Assistenten und Technik, die im Hintergrund läuft.</h1>
    <p class="lead">Wir sind zwei Gründer aus Hamburg. Wir bauen dir eine Website von Hand, einen Assistenten, der dir morgens den Tag zusammenfasst, und die Technik dahinter. Der Film rechts zeigt, wie das aussieht. Scroll einfach weiter.</p>
    <div class="cta-row">
      <a class="btn btn-primary btn-lg" href="#kontakt">Kontakt</a>
      <a class="btn btn-ghost btn-lg" href="#k-website" data-scroll>Zum Film</a>
    </div>
  </article>

  <article data-chapter="website" class="copy">
    <p class="eyebrow">01 · Websites</p>
    <h2 class="h-chapter">Deine Website. Von Hand gebaut.</h2>
    <div class="body">
      <p>Am Laptop und am Handy. Preise und Öffnungszeiten stehen dort, wo deine Kunden nachsehen, und sie stimmen, weil du sie selbst ändern kannst.</p>
      <p>Anfragen landen direkt bei dir im Postfach. Wer das Formular abschickt, bekommt sofort eine Bestätigung.</p>
    </div>
    <ul class="facts">
      <li>Eigene Gestaltung, kein Baukasten</li>
      <li>Schnell, ohne Cookies, ohne Tracking</li>
      <li>Live in etwa zehn Tagen nach Erhalt deiner Inhalte</li>
    </ul>
    <p class="demo-note">Im Film: <strong>Rad am Spritzenplatz</strong>, ein Demo-Projekt. Die Werkstatt ist erfunden, die Website haben wir gebaut.</p>
    <div class="offer" data-offer="full"></div>
  </article>

  <article data-chapter="assistent" class="copy">
    <p class="eyebrow">02 · Assistent</p>
    <h2 class="h-chapter">Dein Assistent meldet sich.</h2>
    <div class="body">
      <p>Jeden Morgen zu der Zeit, die du festlegst: Wetter, Termine und die Mails, die warten. Auf Wunsch als kurze Sprachnotiz, damit du beim Aufschließen schon Bescheid weißt.</p>
      <p>Uhrzeit, Inhalte und Sprache stellst du selbst ein. Jedes Briefing nach deinen Wünschen.</p>
    </div>
    <ul class="facts">
      <li>Wetter, Termine, Mails, auf Wunsch Verkehr</li>
      <li>Läuft in dem Messenger, den du schon nutzt</li>
      <li>Preis auf Anfrage – jedes Setup ist anders.</li>
    </ul>
  </article>

  <article data-chapter="automatisierung" class="copy">
    <p class="eyebrow">03 · Automatisierung</p>
    <h2 class="h-chapter">Im Hintergrund läuft viel Technik.</h2>
    <div class="body">
      <p>Hinter jedem Kästchen stecken sechs Schritte: Mail empfangen, Absender prüfen, Inhalt lesen, wichtig oder nicht, zusammenfassen, ablegen. Du siehst davon nur einen Schalter, der alle Postfächer bündelt.</p>
      <p>Wir bauen das Komplexe. Du bekommst das Einfache.</p>
    </div>
    <p class="key">Läuft bei dir, <span class="mark">nicht bei uns.</span></p>
    <div class="body">
      <p>Die Automatik läuft auf deinen Konten und deinen Geräten. Wir richten sie ein und erklären sie dir. Deine Daten bleiben bei dir.</p>
    </div>
    <ul class="facts">
      <li>Postfächer bündeln, Anfragen sortieren, Rechnungen erkennen</li>
      <li>Ein Schalter, kein Dashboard</li>
      <li>Preis auf Anfrage – jedes Setup ist anders.</li>
    </ul>
  </article>

  <article data-chapter="postfach" class="copy">
    <p class="eyebrow">04 · Zusammenfassung</p>
    <h2 class="h-chapter">Du bekommst eine klare Zusammenfassung.</h2>
    <div class="body">
      <p>Direkt in dein Postfach, in der Mail-App, die du schon hast. Keine neue App, kein neues Passwort, nichts zu installieren.</p>
      <p>Jede Zusammenfassung ist persönlich aufgebaut: für die Werkstatt anders als für den Markt, für dich anders als für deine Kollegin.</p>
    </div>
    <ul class="facts">
      <li>Vier Abschnitte: Wetter, Termine, Mails, offene Punkte</li>
      <li>Ein Klick auf „Erledigt“, fertig für heute</li>
      <li>Keine neue App</li>
    </ul>
  </article>

  <article data-chapter="hamburg" class="copy">
    <p class="eyebrow">05 · Über uns</p>
    <h2 class="h-chapter">Zwei Gründer aus Hamburg.</h2>
    <div class="body">
      <p>Luca-Kay Bartolucci kommt aus dem Einzelhandel und kennt Ladenfläche, Lager und Frühschicht. Cederic Langpaap baut die Technik. Wir wissen, wie wenig Zeit ein Laden am Tag für seine Website hat. Deshalb bauen wir sie so, dass sie ohne dich läuft.</p>
      <p>Am Ende des Films wird aus der getippten Adresse eine echte Seite. Diese hier.</p>
    </div>
    <ul class="facts">
      <li>Zwei Korrekturrunden sind immer drin</li>
      <li>Wir antworten meistens am selben Tag</li>
      <li>Treffen bei dir im Laden oder am Telefon</li>
    </ul>
    <div class="cta-row">
      <a class="btn btn-primary btn-lg" href="#kontakt">Schreib uns</a>
    </div>
  </article>
